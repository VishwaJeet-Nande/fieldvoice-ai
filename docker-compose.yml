services:
  postgres:
    image: postgres:16-alpine
    container_name: fieldvoice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fieldvoice
    ports:
      - "5433:5432"
    volumes:
      - fieldvoice_postgres_data:/var/lib/postgresql/data

volumes:
  fieldvoice_postgres_data:
